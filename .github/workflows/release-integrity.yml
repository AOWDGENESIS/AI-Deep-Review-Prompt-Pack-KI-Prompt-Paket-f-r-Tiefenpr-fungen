name: Release integrity gate

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile validator
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python -m py_compile scripts/validate_release.py

      - name: Validate required files, profile parity, forms, and checksums
        run: python scripts/validate_release.py
