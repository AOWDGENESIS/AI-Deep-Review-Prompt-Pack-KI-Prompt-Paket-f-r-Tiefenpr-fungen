name: Release integrity gate

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and release archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Print SHA-256 values for manifest maintenance
        run: sha256sum scripts/audit_reference_links.py tests/test_reference_link_audit.py .github/workflows/reference-link-audit.yml .github/workflows/release-integrity.yml

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile validator
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python -m py_compile scripts/validate_release.py

      - name: Test manifest validator failure modes
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: python -m unittest discover -s tests -v

      - name: Validate repository files, profile parity, forms, and checksums
        run: python scripts/validate_release.py

      - name: Build and validate isolated staging ZIP
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/release.zip
          EXTRACT_DIR: ${{ runner.temp }}/release-extract
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FAIL: VERSION must use MAJOR.MINOR.PATCH format"
            exit 1
          fi
          EXPECTED_ROOT="$(printf 'ai-deep-review-prompt-pack-v%s' "$VERSION")"
          export VERSION EXPECTED_ROOT
          git archive --format=zip --prefix="$(printf '%s/' "$EXPECTED_ROOT")" HEAD -o "$ARCHIVE"
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import PurePosixPath
          archive = os.environ["ARCHIVE"]
          expected_root = os.environ["EXPECTED_ROOT"]
          version = os.environ["VERSION"]
          forbidden = {".git", "__pycache__", "node_modules", ".venv", "venv", "dist", "build", ".pytest_cache", ".mypy_cache"}
          with zipfile.ZipFile(archive) as zf:
              bad_member = zf.testzip()
              if bad_member is not None:
                  raise SystemExit(f"FAIL: ZIP CRC error in {bad_member}")
              infos = zf.infolist()
              names = [item.filename for item in infos]
              if not names or len(names) != len(set(names)):
                  raise SystemExit("FAIL: ZIP is empty or contains duplicate entries")
              roots = set()
              for item in infos:
                  name = item.filename
                  if "\\" in name:
                      raise SystemExit(f"FAIL: backslash path: {name}")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"FAIL: unsafe path: {name}")
                  if not path.parts:
                      raise SystemExit("FAIL: empty archive path")
                  roots.add(path.parts[0])
                  if path.parts[0] != expected_root:
                      raise SystemExit(f"FAIL: entry outside expected root: {name}")
                  if any(part.lower() in forbidden for part in path.parts):
                      raise SystemExit(f"FAIL: forbidden path component: {name}")
                  if len(path.parts) > 1 and ":" in path.parts[1]:
                      raise SystemExit(f"FAIL: drive-like path: {name}")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit(f"FAIL: symlink in ZIP: {name}")
              if roots != {expected_root}:
                  raise SystemExit(f"FAIL: unexpected top-level roots: {sorted(roots)}")
              required = {
                  expected_root + "/README.md",
                  expected_root + "/scripts/validate_release.py",
                  expected_root + "/RELEASE_MANIFEST.sha256",
                  expected_root + "/LICENSE",
                  expected_root + "/CHANGELOG.md",
                  expected_root + f"/RELEASE_NOTES_v{version}.md",
                  expected_root + "/prompts/standalone/PROFILE_MANIFEST.json",
              }
              if not required.issubset(set(names)):
                  raise SystemExit("FAIL: required release files missing from ZIP")
              print(f"PASS: ZIP isolation; one root, {len(infos)} entries, no .git/cache/build paths")
          PY
          mkdir -p "$EXTRACT_DIR"
          python -c 'import os,sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$ARCHIVE" "$EXTRACT_DIR"
          python "$EXTRACT_DIR/$EXPECTED_ROOT/scripts/validate_release.py"
